version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*"]
      tauri:
        patterns: ["@tauri-apps/*"]
      three:
        patterns: ["three", "@types/three", "@react-three/*"]
      tooling:
        patterns: ["vite", "@vitejs/*", "vitest", "@biomejs/*", "turbo", "typescript", "tailwindcss", "@tailwindcss/*"]
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
