# Labels a pull request by what it touches. The point in a monorepo is that
# "which layer does this change" is the first question a reviewer asks, and the
# dependency direction (tokens <- ui <- kernel <- apps <- shell <- hosts) makes
# the answer matter: a change to a lower layer can move everything above it.

'area: tokens':
  - changed-files:
      - any-glob-to-any-file: 'packages/tokens/**'

'area: ui':
  - changed-files:
      - any-glob-to-any-file: 'packages/ui/**'

'area: kernel':
  - changed-files:
      - any-glob-to-any-file: ['packages/kernel/**', 'packages/vfs/**', 'packages/platform/**']

'area: apps':
  - changed-files:
      - any-glob-to-any-file: 'packages/apps/**'

'area: shell':
  - changed-files:
      - any-glob-to-any-file: 'packages/shell/**'

'area: web':
  - changed-files:
      - any-glob-to-any-file: 'apps/web/**'

'area: landing':
  - changed-files:
      - any-glob-to-any-file: 'apps/landing/**'

'area: desktop':
  - changed-files:
      - any-glob-to-any-file: ['apps/desktop/**', 'crates/**', 'Cargo.toml', 'Cargo.lock']

'area: rust':
  - changed-files:
      - any-glob-to-any-file: ['crates/**', '**/*.rs']

'area: ci':
  - changed-files:
      - any-glob-to-any-file: ['.github/**', 'turbo.json', 'scripts/**']

'area: docs':
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'docs/**']

dependencies:
  - changed-files:
      - any-glob-to-any-file: ['pnpm-lock.yaml', 'package.json', '**/package.json']
