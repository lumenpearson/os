name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here only reads the repository and uploads artefacts, so the token
# gets read access and nothing else. Without this block it inherits whatever
# the repository's default is, which on many repositories is write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  web:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Catches module names that differ only by case before the macOS and
      # Windows builds do, since those are the only jobs that would notice.
      - run: pnpm check:portability
      # The landing page names every built-in app. Nothing else would notice
      # if it named one the OS does not ship, or missed one it does.
      - run: pnpm check:apps
      - run: pnpm check:i18n
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: apps/landing/dist
          retention-days: 7

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @lumen/web exec playwright install --with-deps chromium
      - run: pnpm --filter @lumen/web build
      - run: pnpm --filter @lumen/web test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  rust:
    name: Rust · fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # Pinned to a commit rather than to @stable, which is a branch whose
      # action.yml defaults `toolchain` to stable. Pinning loses that default,
      # so the toolchain is named here instead — same behaviour, and a tag
      # that cannot be moved under us.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deslop:
    name: Design slop scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: kill-ai-slop
        run: |
          node .claude/skills/kill-ai-slop/scripts/scan.mjs . \
            --exclude=node_modules --exclude=dist --exclude=target --exclude=.claude \
            --exclude=pnpm-lock.yaml | tee deslop.txt
      - uses: actions/upload-artifact@v4
        with:
          name: deslop-report
          path: deslop.txt
